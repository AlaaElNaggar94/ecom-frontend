<!-- Loading -->

<div *ngIf="isLoading" class="text-center my-5 py-5">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden"> Loading... </span>
  </div>
</div>

<!-- No Products -->

<div *ngIf="!isLoading && products.length === 0" class="text-center py-5">
  <h4>No products found</h4>
</div>

<!-- Products -->

<div
  *ngIf="!isLoading && products.length > 0"
  class="row row-cols-1 row-cols-md-3 g-4"
>
  <div class="col" *ngFor="let product of products; trackBy: trackByProduct">
    <app-product-card
      [product]="product"
      (addToCart)="onAddToCart($event)"
      (details)="onDetails($event)"
    >
    </app-product-card>
  </div>
</div>
