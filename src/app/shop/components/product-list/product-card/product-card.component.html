<div class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden">
  <!-- Images -->

  <app-product-images
    [photos]="product.photos"
    [productName]="product.name || ''"
    [baseUrl]="baseUrl"
  >
  </app-product-images>

  <div class="card-body d-flex flex-column">
    <!-- Name -->

    <h5 class="card-title fw-bold text-truncate" [title]="product.name">
      {{ product.name ? product.name : "Unknown Product" }}
    </h5>

    <!-- Description -->

    <p class="card-text text-muted small text-truncate-2">
      {{
        product.description ? product.description : "No description available."
      }}
    </p>

    <!-- Prices -->

    <div class="mt-auto mb-3">
      <span
        *ngIf="product.oldPrice"
        class="text-decoration-line-through text-muted me-2"
      >
        ${{ product.oldPrice }}
      </span>

      <span class="fw-bold fs-5">
        ${{ product.newPrice ? product.newPrice : 0 }}
      </span>
    </div>

    <!-- Buttons -->

    <div class="d-flex gap-2">
      <button class="btn btn-dark flex-fill" (click)="onAddToCart()">
        <i class="fa fa-shopping-cart me-1"></i>

        Add to Cart
      </button>

      <button class="btn btn-success flex-fill" (click)="onDetails()">
        <i class="fa fa-info-circle me-1"></i>

        Details
      </button>
    </div>
  </div>
</div>
