<div class="product-media">
  <!-- Main Image with Zoom -->
  @if (useZoom && thumbImage && fullImage) {
    <div class="product-image-container">
      <lib-ngx-image-zoom
        [thumbImage]="thumbImage"
        [fullImage]="fullImage"
        [magnification]=".3"
        [enableLens]="true"
        [lensWidth]="200"
        [lensHeight]="200"
        [enableScrollZoom]="true"
      >
      </lib-ngx-image-zoom>
    </div>
  } @else {
    <div class="main-image">
      <img
        [src]="currentImage"
        [alt]="productName || 'Product'"
        class="big-photo"
      />
    </div>
  }

  <!-- Thumbnails -->
  @if (photos && photos.length) {
    <div class="thumbs">
      @for (photo of photos; track photo.id || photo.imageUrl; let i = $index) {
        <button
          type="button"
          class="thumb-btn"
          [class.active]="selectedIndex === i"
          (click)="selectPhoto(i)"
        >
          <img
            class="thumb-photo"
            [src]="baseUrl + photo.imageUrl"
            [alt]="productName || 'Product thumbnail'"
          />
        </button>
      }
    </div>
  }
</div>
