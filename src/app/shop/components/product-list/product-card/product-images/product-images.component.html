<div class="product-media">
  <!-- Main Image with Zoom -->
  @if (useZoom && thumbImage && fullImage) {
    <app-image-zoom
      [thumbImage]="thumbImage"
      [fullImage]="fullImage"
    ></app-image-zoom>
  } @else {
    <div class="main-image">
      <img
        [src]="currentImage"
        [alt]="productName || 'Product'"
        class="big-photo"
      />
    </div>
  }

  <!-- Thumbnails -->
  @if (photos && photos.length) {
    <div class="thumbs">
      @for (photo of photos; track photo.id || photo.imageUrl; let i = $index) {
        <button
          type="button"
          class="thumb-btn"
          [class.active]="selectedIndex === i"
          (click)="selectPhoto(i)"
        >
          <img
            class="thumb-photo"
            [src]="baseUrl + photo.imageUrl"
            [alt]="productName || 'Product thumbnail'"
          />
        </button>
      }
    </div>
  }
</div>
