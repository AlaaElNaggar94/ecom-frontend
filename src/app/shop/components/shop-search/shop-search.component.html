<div class="d-flex justify-content-between align-items-center mb-4">
  <!-- Counter -->

  <span class="text-muted" *ngIf="totalCount > 0">
    Showing

    <strong> {{ from }} - {{ to }} </strong>

    of

    <strong>
      {{ totalCount }}
    </strong>
  </span>

  <span *ngIf="totalCount === 0" class="text-muted"> 0 Results </span>

  <!-- Search -->

  <div class="d-flex gap-2" style="max-width: 350px">
    <input
      type="text"
      class="form-control"
      placeholder="Search..."
      [(ngModel)]="searchTerm"
      (keyup.enter)="onSearch()"
    />

    <button class="btn btn-danger" (click)="onSearch()">Search</button>

    <button class="btn btn-dark" (click)="onReset()">Reset</button>
  </div>
</div>
