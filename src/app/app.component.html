<app-nav-bar></app-nav-bar>

<div class="container my-5">
  <h2 class="mb-4 text-center fw-bold">المنتجات</h2>

  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">جاري التحميل...</span>
    </div>
  </div>

  <!-- Display Products -->
  <div class="row" *ngIf="!isLoading">
    <div class="col-md-3 mb-4" *ngFor="let item of products">
      <div class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden">
        
        <!-- الصورة الأولى من مصفوفة الصور أو صورة افتراضية -->
        <img 
          [src]="item.photos && item.photos.length > 0 ? 'http://localhost:4321' + item.photos[0].imageUrl : 'assets/images/placeholder.png'" 
          class="card-img-top p-3" 
          [alt]="item.name" 
          style="height: 200px; object-fit: contain;">

        <div class="card-body d-flex flex-column">
          <!-- اسم المنتج -->
          <h5 class="card-title text-truncate fw-bold" [title]="item.name">{{ item.name }}</h5>
          
          <!-- القسم (Category) -->
          <small class="text-muted mb-2">{{ item.categoryName }}</small>

          <!-- السعر القديم والجديد -->
          <div class="d-flex align-items-center gap-2 mb-3">
            <span class="text-success fw-bold fs-5">{{ item.newPrice | currency:'EGP ':'symbol':'1.0-0' }}</span>
            <span *ngIf="item.oldPrice" class="text-muted text-decoration-line-through small">
              {{ item.oldPrice | currency:'EGP ':'symbol':'1.0-0' }}
            </span>
          </div>

          <button class="btn btn-primary mt-auto w-100">إضافة للحقيبة</button>
        </div>
      </div>
    </div>
  </div>
</div>
