<div class="p-2" [formGroup]="addressForm">
  <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
    <i class="fas fa-map-marker-alt text-primary"></i>
    Shipping Address
  </h5>

  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold text-secondary">First Name</label>
      <input 
        type="text" 
        formControlName="firstName" 
        class="form-control form-control-lg rounded-3"
        [class.is-invalid]="addressControls['firstName'].invalid && addressControls['firstName'].touched"
        placeholder="John"
      />
      <div class="invalid-feedback">First name is required</div>
    </div>

    <div class="col-md-6">
      <label class="form-label fw-semibold text-secondary">Last Name</label>
      <input 
        type="text" 
        formControlName="lastName" 
        class="form-control form-control-lg rounded-3"
        [class.is-invalid]="addressControls['lastName'].invalid && addressControls['lastName'].touched"
        placeholder="Doe"
      />
      <div class="invalid-feedback">Last name is required</div>
    </div>

    <div class="col-12">
      <label class="form-label fw-semibold text-secondary">Street Address</label>
      <input 
        type="text" 
        formControlName="street" 
        class="form-control form-control-lg rounded-3"
        [class.is-invalid]="addressControls['street'].invalid && addressControls['street'].touched"
        placeholder="123 Main Street, Apt 4B"
      />
      <div class="invalid-feedback">Street address is required</div>
    </div>

    <div class="col-md-4">
      <label class="form-label fw-semibold text-secondary">City</label>
      <input 
        type="text" 
        formControlName="city" 
        class="form-control form-control-lg rounded-3"
        [class.is-invalid]="addressControls['city'].invalid && addressControls['city'].touched"
        placeholder="Cairo"
      />
      <div class="invalid-feedback">City is required</div>
    </div>
    <div class="col-md-4">
      <label class="form-label fw-semibold text-secondary">zipCode</label>
      <input 
        type="text" 
        formControlName="zipCode" 
        class="form-control form-control-lg rounded-3"
        [class.is-invalid]="addressControls['zipCode'].invalid && addressControls['zipCode'].touched"
        placeholder="Cairo"
      />
      <div class="invalid-feedback">zipCode is required</div>
    </div>

    <div class="col-md-4">
      <label class="form-label fw-semibold text-secondary">State / Country</label>
      <input 
        type="text" 
        formControlName="state" 
        class="form-control form-control-lg rounded-3"
        [class.is-invalid]="addressControls['state'].invalid && addressControls['state'].touched"
        placeholder="Egypt"
      />
      <div class="invalid-feedback">State/Country is required</div>
    </div>
  </div>

  <div class="d-flex justify-content-end mt-4">
<button 
      type="button" 
      (click)="onNext()" 
      [disabled]="isLoading"
      class="btn btn-primary px-4 py-2 rounded-3 fw-semibold d-flex align-items-center gap-2">
      <span *ngIf="isLoading" class="spinner-border spinner-border-sm"></span>
      <span>Next: Payment</span>
      <i *ngIf="!isLoading" class="fas fa-arrow-right ms-1"></i>
    </button>
  </div>
</div>
