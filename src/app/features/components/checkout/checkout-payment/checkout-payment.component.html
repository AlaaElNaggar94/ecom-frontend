<div class="p-2" [formGroup]="paymentForm">
  <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
    <i class="fas fa-credit-card text-primary"></i>
    Payment Method
  </h5>

  <div class="d-flex flex-column gap-3">
    <label class="payment-card border rounded-3 p-3 d-flex align-items-center justify-content-between cursor-pointer">
      <div class="d-flex align-items-center gap-3">
        <input type="radio" formControlName="paymentMethod" value="card" class="form-check-input mt-0">
        <div>
          <div class="fw-semibold">Credit / Debit Card</div>
          <small class="text-muted">Pay securely with Visa or Mastercard</small>
        </div>
      </div>
      <div class="fs-4 text-primary d-flex gap-2">
        <i class="fab fa-cc-visa"></i>
        <i class="fab fa-cc-mastercard"></i>
      </div>
    </label>

    <label class="payment-card border rounded-3 p-3 d-flex align-items-center justify-content-between cursor-pointer">
      <div class="d-flex align-items-center gap-3">
        <input type="radio" formControlName="paymentMethod" value="cod" class="form-check-input mt-0">
        <div>
          <div class="fw-semibold">Cash on Delivery (COD)</div>
          <small class="text-muted">Pay with cash when your package arrives</small>
        </div>
      </div>
      <i class="fas fa-money-bill-wave fs-4 text-success"></i>
    </label>
  </div>

  <div class="d-flex justify-content-between mt-4">
    <button type="button" matStepperPrevious class="btn btn-outline-secondary px-4 py-2 rounded-3">
      <i class="fas fa-arrow-left me-2"></i> Back
    </button>
    <button type="button" matStepperNext class="btn btn-primary px-4 py-2 rounded-3 fw-semibold">
      Next: Review <i class="fas fa-arrow-right ms-2"></i>
    </button>
  </div>
</div>
