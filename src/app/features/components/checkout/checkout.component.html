<div class="container py-5">
  <!-- Page Header -->
  <!-- <div class="row mb-4">
    <div class="col-12">
      <h2 class="fw-bold mb-1">Checkout Process</h2>
      <p class="text-muted">Complete your details to place your order</p>
    </div>
  </div> -->

  <form [formGroup]="checkoutForm" (ngSubmit)="submitOrder()">
    <div class="row g-4">
      <!-- Left Column: Stepper Component -->
      <div class="col-lg-8">
        <app-checkout-stepper
          [checkoutForm]="checkoutForm"
          [deliveryMethods]="deliveryMethods"
          [isSubmitting]="isSubmitting"
          [isAddressLoading]="isAddressLoading"
          (saveAddress)="onSaveAddress($event)"
          (deliveryMethodSelected)="onDeliveryMethodSelected($event)"
          (submitOrder)="submitOrder()"
        >
        </app-checkout-stepper>
      </div>

      <!-- Right Column: Order Summary Component -->
      <div class="col-lg-4">
        <app-order-summary
          *ngIf="basket$ | async as basket"
          [basket]="basket"
          [checkoutForm]="checkoutForm"
          [isSubmitting]="isSubmitting"
          [baseUrl]="baseUrl"
        >
        </app-order-summary>
      </div>
    </div>
  </form>
</div>
