<div class="p-2" [formGroup]="deliveryForm">
  <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
    <i class="fas fa-truck text-primary"></i>
    Delivery Method
  </h5>

  <div class="d-flex flex-column gap-3">
    <!-- تكرار طرق الشحن القادمة من الباك إند -->
    <label 
      *ngFor="let method of deliveryMethods"
      class="delivery-card border rounded-3 p-3 d-flex align-items-center justify-content-between cursor-pointer">
      
      <div class="d-flex align-items-center gap-3">
        <input 
          type="radio" 
          formControlName="deliveryMethodId" 
          [value]="method.id" 
          (change)="setShippingPrice(method)"
          class="form-check-input mt-0">
          
        <div>
          <div class="fw-semibold">{{ method.name }}</div>
          <small class="text-muted d-block">{{ method.description }}</small>
          <small class="badge bg-light text-dark border mt-1">
            <i class="far fa-clock me-1"></i> {{ method.deliveryTime }}
          </small>
        </div>
      </div>

      <div class="fw-bold text-primary fs-5">
        {{ method.price | currency }}
      </div>
    </label>
  </div>

  <div class="d-flex justify-content-between mt-4">
    <button type="button" matStepperPrevious class="btn btn-outline-secondary px-4 py-2 rounded-3">
      <i class="fas fa-arrow-left me-2"></i> Back
    </button>
    <button 
      type="button" 
      matStepperNext 
      [disabled]="deliveryForm.invalid"
      class="btn btn-primary px-4 py-2 rounded-3 fw-semibold">
      Next: Payment <i class="fas fa-arrow-right ms-2"></i>
    </button>
  </div>
</div>
