<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg border-0 rounded-lg">
        <div class="card-header bg-success text-white text-center py-3">
          <h3 class="mb-0">تسجيل الدخول</h3>
        </div>
        <div class="card-body p-4">

          @if (error) {
            <div class="alert alert-danger" role="alert">
              {{ error }}
            </div>
          }

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">البريد الإلكتروني</label>
              <input type="email" formControlName="email" class="form-control"
                [ngClass]="{'is-invalid': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}">
            </div>

            <div class="mb-3">
              <label class="form-label">كلمة المرور</label>
              <input type="password" formControlName="password" class="form-control"
                [ngClass]="{'is-invalid': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}">
            </div>

            <div class="d-flex justify-content-between mb-3">
              <a routerLink="/account/forgot-password" class="text-decoration-none small">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2" [disabled]="loginForm.invalid || loading">
              @if (loading) {
                <span class="spinner-border spinner-border-sm me-2"></span>
              }
              دخول
            </button>
          </form>
        </div>
        <div class="card-footer text-center py-3">
          <small>ليس لديك حساب؟ <a routerLink="/account/register" class="text-decoration-none">سجل الآن</a></small>
        </div>
      </div>
    </div>
  </div>
</div>
