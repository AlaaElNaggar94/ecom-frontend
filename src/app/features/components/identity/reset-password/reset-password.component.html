<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0">
        <div class="card-header bg-info text-white text-center py-3">
          <h3 class="mb-0">تعيين كلمة مرور جديدة</h3>
        </div>
        <div class="card-body p-4">

          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
          <div *ngIf="message" class="alert alert-success">{{ message }}</div>

          <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="email && token; else invalidLink">
            
            <div class="mb-3">
              <label class="form-label">كلمة المرور الجديدة</label>
              <input type="password" formControlName="newPassword" class="form-control">
              <div *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.hasError('required')" class="text-danger small mt-1">
                كلمة المرور مطلوبة.
              </div>
              <div *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.hasError('minlength')" class="text-danger small mt-1">
                كلمة المرور يجب أن لا تقل عن 6 أحرف.
              </div>
            </div>

            <!-- حقل تأكيد كلمة المرور الجديد -->
            <div class="mb-3">
              <label class="form-label">تأكيد كلمة المرور</label>
              <input type="password" formControlName="confirmPassword" class="form-control">
              <div *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.get('confirmPassword')?.hasError('passwordMismatch')" class="text-danger small mt-1">
                كلمتا المرور غير متطابقتين.
              </div>
            </div>

            <button type="submit" class="btn btn-info w-100 py-2 text-white" [disabled]="resetForm.invalid || loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
              حفظ كلمة المرور
            </button>
          </form>

          <ng-template #invalidLink>
            <div class="alert alert-danger text-center">رابط غير صالح أو بيانات ناقصة.</div>
          </ng-template>

        </div>
      </div>
    </div>
  </div>
</div>
