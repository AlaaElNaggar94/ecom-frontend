<div class="container my-5">
  <div class="text-center mb-5">
    <h2 class="fw-bold">المشاريع الخاصة</h2>
    <p class="text-muted">اختر مشروعاً لمعاينة التفاصيل الكاملة</p>
  </div>

  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let project of projects">
      <div 
        class="card h-100 project-card border-0 shadow-sm rounded-4 overflow-hidden" 
        [routerLink]="project.route"
        style="cursor: pointer;">
        
        <!-- صورة المشروع -->
        <div class="position-relative">
          <img [src]="project.image" class="card-img-top project-img" [alt]="project.title">
          <span class="badge bg-primary position-absolute top-0 end-0 m-3 px-3 py-2 rounded-pill">
            {{ project.category }}
          </span>
        </div>

        <!-- تفاصيل الكارت -->
        <div class="card-body d-flex flex-column p-4">
          <h5 class="card-title fw-bold mb-2">{{ project.title }}</h5>
          <p class="card-text text-muted flex-grow-1 fs-6">
            {{ project.description }}
          </p>

          <div class="pt-3 border-top mt-3 d-flex justify-content-between align-items-center">
            <span class="text-primary fw-bold fs-6">فتح المشروع</span>
            <i class="fa fa-arrow-left text-primary"></i>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
